# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# LWJGL2 compatibility is disabled: the engine GL facade owns all GL access.
enable_lwjglx = false

# Mod Information
mod_version = 0.1.0
root_package = com.schmaloogium
mod_id = schmaloogium
mod_name = Schmaloogium

# Mod Metadata (Optional)
mod_description = OptiFine/Iris-format shader-pack support for Cleanroom on Minecraft 1.12.2
mod_url = https://github.com/ndellagrotte/Schmaloogium
mod_update_json =
mod_authors = the Schmaloogium contributors
mod_credits = GPL-3.0-or-later. See LICENSE and THIRD-PARTY.md.
mod_logo_path =
mod_issue_tracker =

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Access Transformers: disabled for Schmaloogium (Mixin hooks only).
use_access_transformer = false

# Coremods: MixinBooter's early loader registers the mixin configs (dev AND prod;
# manifest MixinConfigs discovery cannot see the dev run's classes directories).
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.schmaloogium.mod.mixin.SchmaloogiumCoreMod

# AssetMover: not used.
use_asset_mover = false
asset_mover_version = 2.5

# Cleanroom loader pin (build.gradle consumes this; see PINS.md)
cleanroom_loader_version = 0.6.10-alpha

# Mixin (configs shipped in mod/src/main/resources; the single registration
# authority is SchmaloogiumCoreMod#getMixinConfigs — see PHASE_1_DOC §4.5 note)
enable_mixin_debug = true

# Engine dependency pins (exact, verified; see PINS.md)
jcpp_version = 1.4.14
asm_version = 9.10.1
