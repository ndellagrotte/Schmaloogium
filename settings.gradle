pluginManagement {
    repositories {
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            url = 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            url = 'https://maven.arcseekers.com/releases'
        }
        maven {
            url = 'https://maven.wagyourtail.xyz/snapshots'
        }
        maven {
            name = 'CleanroomMC'
            url = 'https://maven.cleanroommc.com'
        }
    }
}

plugins {
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Literal, not directory-derived: under a multi-project build the root name leaks into
// IDEA module keys and publishing (PHASE_1_DOC §4.2.1, D-P1-2).
rootProject.name = 'Schmaloogium'

include 'engine'
include 'mod'
include 'conformance'
