plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

// Bytecode must load into the Gradle daemon JVM (PHASE_1_DOC §4.2.3); 17 is the
// lowest version a Gradle 9 daemon can run, so it loads on every supported daemon.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
