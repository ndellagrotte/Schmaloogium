# mp-options: #define switches, #define variables with ranges, const options,
# sliders, screen layout, profiles, lang files (§3.3, App F.3/F.4 shape).

#define SHADOWS
#define SHADOW_SOFTNESS 2 // [0 1 2 3 4]
#define SUN_ANGLE 30.0 // [-180.0 180.0]
#define WATER_TINT r0.0 g0.3 b0.6

const int shadowMapResolution = 1024;
const float sunPathRotation = -30.0;

screen = <empty> [SHADOW_SOFTNESS SUN_ANGLE] SHADOWS WATER_TINT
sliders = SHADOW_SOFTNESS SUN_ANGLE
profile.PERFORMANCE = SHADOWS_OFF SHADOW_SOFTNESS=0
profile.FANCY = SHADOWS SHADOW_SOFTNESS=3

# jtm: option metadata uses the owner's codec; this fixture stays tiny.
