// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// Note: build.gradle's script scope defines no helper methods; this script uses only
// the project object (§12 item 45 keeps this comment truthful).

// Buildship otherwise misses dependencies Unimined adds directly to the source set.
plugins.withId('eclipse') {
    def eclipseDependencies = configurations.create('eclipseDependencies') {
        canBeConsumed = false
        canBeResolved = true
    }
    dependencies.add(eclipseDependencies.name, files(provider {
        sourceSets.main.compileClasspath
    }))
    eclipse.classpath.plusConfigurations += [eclipseDependencies]
    eclipse.synchronizationTasks(tasks.named('generateJavaTemplates'))
}
