name: Build mod jar

on:
  [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.7.0
      name: Set up Gradle
    - name: Add permission
      run: chmod +x ./gradlew
    # The named seam steps run BEFORE ./gradlew build: build runs all four seam tests
    # itself through check->test and would go red first under an anonymous name, so a
    # step placed after would never run on the failure it names (PHASE_1_DOC §4.11,
    # D-P1-24). C-1 lives in :engine; C-2 and C-3 live in :mod, so both module test
    # tasks are named.
    - name: Seam architecture test
      run: ./gradlew :engine:test :mod:test
    - name: Conformance module test (C-4)
      run: ./gradlew :conformance:test
    - name: Execute Gradle build
      run: ./gradlew build
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        path: '**/build/libs/*.jar'
    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        path: '**/build/reports/tests/**'
        name: test-reports

  # Filled per PHASE_2_DOC §4.14 (the v0.1 "CI task split + filled conformance job"
  # row): the fixture cache and :conformance:conformanceTest live only in this
  # dispatch-gated job, keeping the push-path :conformance:test hermetic ([D-P2-8]).
  conformance:
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Cache pack fixtures
      uses: actions/cache@v4
      with:
        path: ~/.cache/schmaloogium/conformance-packs
        key: packs-${{ hashFiles('docs/conformance/pack-ids.txt') }}
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Conformance (headless, fixture-dependent)
      run: ./gradlew :conformance:conformanceTest
    - name: Upload conformance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: conformance-report
        path: |
          conformance/build/reports/conformance/**
          **/build/reports/tests/**
