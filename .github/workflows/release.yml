name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
        name: Set up Gradle
      - name: Add permission
        run: chmod +x ./gradlew
      - name: Execute Gradle build
        run: ./gradlew build

      - uses: ncipollo/release-action@v1.21.0
        with:
          # Targeted at :mod: a release never publishes :engine's or :conformance's jars
          # (PHASE_1_DOC §4.11).
          artifacts: "mod/build/libs/*"
          generateReleaseNotes: true
